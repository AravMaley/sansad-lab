name: ingest
on:
  schedule:
    - cron: "30 20 * * *" # 02:00 IST
  workflow_dispatch:
concurrency: ingest
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Ingest from sansad.in
        run: node scripts/ingest/run.js --budget-min=50
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
